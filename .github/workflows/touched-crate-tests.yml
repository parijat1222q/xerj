name: Reviewed-head touched-crate tests
on:
  push:
    branches: [validation/touched-crates]
    paths: [.github/workflows/touched-crate-tests.yml]
permissions:
  contents: read
concurrency:
  group: reviewed-head-touched-crates
  cancel-in-progress: false
jobs:
  crate-tests:
    name: ${{ matrix.crate }} at reviewed head
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: xerj-engine
            sha: 65488135ed9e8032111ca74866bcabe01717da78
          - crate: xerj-api
            sha: 65488135ed9e8032111ca74866bcabe01717da78
    steps:
      - name: Check out exact reviewed solution
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Verify exact solution head
        env:
          EXPECTED_SHA: ${{ matrix.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
      - name: Run touched-crate tests
        working-directory: engine
        env:
          TEST_CRATE: ${{ matrix.crate }}
          CARGO_BUILD_JOBS: 2
          XERJ_DISABLE_FEEDBACK: "true"
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
        run: cargo test --locked --profile ci-test -p "$TEST_CRATE" -- --test-threads=2

  candidate-gates:
    name: Reviewed leaf terms release lint and real-server YAML
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out exact reviewed solution
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 65488135ed9e8032111ca74866bcabe01717da78
          persist-credentials: false
      - name: Verify exact solution head
        run: test "$(git rev-parse HEAD)" = "65488135ed9e8032111ca74866bcabe01717da78"
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          components: rustfmt, clippy
      - name: Format
        working-directory: engine
        run: cargo fmt --all -- --check
      - name: Strict touched-crate lint
        id: strict-lint
        working-directory: engine
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo clippy --locked -p xerj-api -p xerj-engine --all-targets -- -D warnings
      - name: Scoped optimized release and conformance runner
        working-directory: engine
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo build --locked --release -p xerj-api -p xerj-engine -p xerj-server -p es-yaml-runner
      - name: Full real-server YAML conformance
        working-directory: engine
        env:
          XERJ_DISABLE_FEEDBACK: "true"
        run: |
          set -euo pipefail
          DATA="$(mktemp -d)"
          ./target/release/xerj --insecure --bind 127.0.0.1 --port 9200 --data-dir "$DATA" --embed-mode lexical --disable-feedback > /tmp/composite-server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          ready=false
          for _ in $(seq 1 120); do
            if curl -fsS -m1 localhost:9200/_cluster/health >/dev/null; then ready=true; break; fi
            kill -0 "$PID" || { cat /tmp/composite-server.log; exit 1; }
            sleep 0.5
          done
          test "$ready" = true
          ./target/release/es-yaml-runner --dir tests/es-compat-yaml/yaml
      - name: Enforce strict lint gate after independent evidence
        if: always()
        env:
          LINT_OUTCOME: ${{ steps.strict-lint.outcome }}
        run: test "$LINT_OUTCOME" = success
